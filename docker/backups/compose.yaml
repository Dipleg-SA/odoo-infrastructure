# --- Capa de protección + restore ---
# backup es exclusivo de producción; restore-db/restore-files también los lleva
# staging. Este agregador trae los tres — solo lo usa el entrypoint que quiere
# la capa entera. Staging incluye restore-db/restore-files por su cuenta,
# salteando este archivo, porque Compose no puede sacar un servicio ya incluido.

include:
  - backup/compose.yaml
  - restore-db/compose.yaml
  - restore-files/compose.yaml
