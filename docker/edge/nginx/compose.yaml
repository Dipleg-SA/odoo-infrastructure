# --- Proxy ---
# nginx es el único reverse proxy del stack: termina TLS, rutea el bus a su
# puerto propio y aplica el rate-limit del login.
#
# La llevan LOS TRES entornos. Development no tiene túnel ni certificados, pero
# sí proxy: es lo que hace honesto al proxy_mode = True de odoo.conf, que sin
# nadie escribiendo X-Forwarded-* confía en cabeceras que no existen.
services:
  nginx:
    image: nginx:1.31.3-alpine
    # Nombre derivado del proyecto: predecible y sin el sufijo -1 del autonaming,
    # pero sin colisionar si se levanta un segundo stack con otro nombre de proyecto.
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    networks:
      - edge
      - app
    # --- Binds ---
    # Nivel 3 (LAN) por default; un entorno que no atiende la red local los borra
    # con `ports: !reset []` en su entrypoint. cloudflared NO pasa por acá: llega
    # por la red edge, por nombre de contenedor.

    # El último default es loopback y no vacío: sin LOCAL_IP, un bind vacío publica
    # en 0.0.0.0 — falla abierta. Loopback falla cerrada y se nota igual de rápido.

    ports:
      - "${LOCAL_IP:-127.0.0.1}:${HTTP_PORT:-80}:80"
      - "${LOCAL_IP:-127.0.0.1}:${HTTPS_PORT:-443}:443"
    # --- Config ---
    # Archivos reales, gitignoreados, bootstrapeados con cp desde su .example —
    # no plantillas: sin envsubst, sin NGINX_ENVSUBST_FILTER, valores editados
    # a mano en el archivo mismo. Dos compartidos y uno que elige el modo:
    # server-tls para producción y staging, server-plain para development, vía
    # NGINX_MODE en .env.

    volumes:
      - ./00-http.conf:/etc/nginx/conf.d/00-http.conf:ro
      - ./odoo.locations:/etc/nginx/conf.d/odoo.locations:ro
      - ./server-${NGINX_MODE:-tls}.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.50"

volumes:
  letsencrypt:
