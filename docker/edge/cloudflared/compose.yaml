# --- Túnel ---
# El ingreso público entra por acá, sin puertos abiertos en el router.
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.8.0
    command: tunnel --metrics 0.0.0.0:2000 run
    container_name: ${COMPOSE_PROJECT_NAME}-cloudflared
    networks:
      - edge
    secrets:
      - cloudflare_tunnel_token
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tunnel_token
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
    restart: unless-stopped
    mem_limit: 64m
    cpus: "0.15"
