# --- Capa de borde ---
# dnsmasq es exclusivo de producción; nginx, cloudflared y certbot también los
# lleva staging. Este agregador trae los cuatro — solo lo usa el entrypoint que
# quiere la capa entera. Staging y development incluyen el resto por su cuenta,
# salteando este archivo, porque Compose no puede sacar un servicio ya incluido.

include:
  - dnsmasq/compose.yaml
  - nginx/compose.yaml
  - cloudflared/compose.yaml
  - certbot/compose.yaml
