# Entrypoint de development: proxy, datos y aplicación, en la máquina del operador.
# Ni túnel ni certificados ni dnsmasq; tampoco backups, restore ni observabilidad.
#
# El nombre del stack NO se declara acá — sale de COMPOSE_PROJECT_NAME en .env, y
# tiene que ser único por checkout: dos que lo compartan comparten los volúmenes.

networks:
  edge:
  app:

# --- Tres secrets, los tres generados ---
# secrets-init.sh los saca de openssl: un checkout nuevo no pide ningún valor a mano.

secrets:
  postgres_password:
    file: ../secrets/postgres_password
  pgbouncer_credentials:
    file: ../secrets/pgbouncer_credentials
  odoo_admin_password:
    file: ../secrets/odoo_admin_password

include:
  - compose.proxy.yaml
  - compose.db.yaml
  - compose.odoo.yaml

services:
  # --- Solo el 80, y en loopback ---
  # server-plain no escucha en el 443: publicarlo ataría un puerto de la máquina para nada.

  nginx:
    ports: !override
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    # --- Modo del template, fijado acá ---
    # Si dependiera de NGINX_MODE, un .env sin la clave montaría server-tls y nginx no arranca: no hay cert.

    volumes:
      - ../config/nginx/server-plain.conf.template:/etc/nginx/templates/default.conf.template:ro

  # --- Sin pgBackRest ---
  # No archiva ni restaura, así que no lleva la credencial de R2 (PG_ARCHIVE_MODE=off en su .env).

  postgres:
    secrets: !override
      - postgres_password

  # --- Sin correo saliente ---
  # Una base de prueba suele venir de un dump con direcciones reales; el riesgo es el de staging.

  odoo:
    environment:
      SMTP_HOST: ""
    secrets: !override
      - postgres_password
      - odoo_admin_password
