# Entrypoint de development: proxy, datos y aplicación, en la máquina del operador.
# Ni túnel ni certificados ni dnsmasq; tampoco backups, restore ni observabilidad.
#
# El nombre del stack NO se declara acá — sale de COMPOSE_PROJECT_NAME en .env, y
# tiene que ser único por checkout: dos que lo compartan comparten los volúmenes.

networks:
  edge:
  app:

# --- Tres secrets, los tres generados ---
# secrets-init.sh los saca de openssl: un checkout nuevo no pide ningún valor a mano.

secrets:
  postgres_password:
    file: ../secrets/postgres_password
  pgbouncer_credentials:
    file: ../secrets/pgbouncer_credentials
  odoo_admin_password:
    file: ../secrets/odoo_admin_password

include:
  - edge/nginx/compose.yaml
  - db/compose.yaml
  - app/compose.yaml

services:
  # --- Solo el 80, y en loopback ---
  # server-plain no escucha en el 443: publicarlo ataría un puerto de la máquina para nada.

  nginx:
    ports: !override
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    # --- Modo fijado acá, no por NGINX_MODE ---
    # Si dependiera de NGINX_MODE, un .env sin la clave montaría server-tls.conf y nginx no arranca: no hay cert.

    volumes:
      - ./edge/nginx/server-plain.conf:/etc/nginx/conf.d/default.conf:ro

  # --- Sin pgBackRest ---
  # No archiva ni restaura, así que no lleva la credencial de R2. archive_mode
  # forzado en off acá — respaldo estructural: aunque postgresql.conf de este
  # checkout se haya bootstrapeado del .example sin editar (que trae "on"),
  # este stack no le empuja WAL a la stanza de producción.

  postgres:
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c archive_mode=off
    secrets: !override
      - postgres_password

  # --- Sin correo saliente ---
  # Una base de prueba suele venir de un dump con direcciones reales; el riesgo es el de staging.

  odoo:
    environment:
      ODOO_DISABLE_SMTP: "1"
    secrets: !override
      - postgres_password
      - odoo_admin_password
