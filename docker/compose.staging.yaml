# Entrypoint de staging: proxy, borde, datos, aplicación y restore. Ni backups ni
# observabilidad —son exclusivas de producción— ni dnsmasq, que no admite un segundo.
#
# El nombre del stack NO se declara acá — sale de COMPOSE_PROJECT_NAME en .env,
# junto a COMPOSE_FILE, igual que en los otros dos entornos.

networks:
  edge:
  app:

# --- Solo los secrets de las capas que lleva ---
# Ocho: Compose falla si un `file:` declarado no existe, y declarar de más obliga a fabricar archivos inertes.

secrets:
  cloudflare_api_token:
    file: ../secrets/cloudflare_api_token
  cloudflare_tunnel_token:
    file: ../secrets/cloudflare_tunnel_token
  postgres_password:
    file: ../secrets/postgres_password
  pgbouncer_credentials:
    file: ../secrets/pgbouncer_credentials
  odoo_admin_password:
    file: ../secrets/odoo_admin_password
  # Lo lee restore-db: la stanza es la de producción y nada de staging le escribe
  # (archive_mode=off forzado sobre postgres, más abajo, es lo que lo garantiza).
  pgbackrest_r2_credentials:
    file: ../secrets/pgbackrest_r2_credentials
  restic_password:
    file: ../secrets/restic_password
  restic_r2_credentials:
    file: ../secrets/restic_r2_credentials

include:
  - edge/nginx/compose.yaml
  - edge/cloudflared/compose.yaml
  - edge/certbot/compose.yaml
  - db/compose.yaml
  - app/compose.yaml
  - backups/restore-db/compose.yaml
  - backups/restore-files/compose.yaml

services:
  # --- Sin puertos publicados ---
  # cloudflared llega al proxy por la red edge; el :80 y el :443 de la LAN los tiene producción.

  nginx:
    ports: !reset []

  # --- Archivado de WAL APAGADO ---
  # Staging apunta a la stanza de producción para poder restaurar. archive_mode
  # forzado en off acá — respaldo estructural: aunque postgresql.conf de este
  # checkout se haya bootstrapeado del .example sin editar (que trae "on"),
  # este stack no le empuja WAL al repositorio del entorno real.

  postgres:
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c archive_mode=off

  # --- Sin correo saliente ---
  # Se siembra con datos reales: con SMTP le mandaría correo de verdad a clientes de verdad.
  # Forzado acá y no solo en el secret: si dependiera de que el odoo.conf de este
  # checkout no tenga smtp_server, un checkout clonado del de producción manda.

  odoo:
    environment:
      ODOO_DISABLE_SMTP: "1"
    secrets: !override
      - postgres_password
      - odoo_admin_password
