# --- Almacén de logs ---
# Single-binary sobre filesystem: sin anillo distribuido, un solo operador.
volumes:
  loki-data:

services:
  loki:
    image: grafana/loki:3.7.6
    container_name: ${COMPOSE_PROJECT_NAME}-loki
    networks:
      - observability
    volumes:
      - loki-data:/loki
      - ./loki.yaml:/etc/loki/loki.yaml:ro
    command: ["-config.file=/etc/loki/loki.yaml"]
    # Sin healthcheck: la imagen es distroless estricta (solo /usr/bin/loki), no hay
    # binario para ejecutar uno. El caso "vivo pero no sirve" lo cubre up == 0 en
    # Prometheus, que lo scrapea directo, y de ahí sale la alerta de servicio caído.
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
