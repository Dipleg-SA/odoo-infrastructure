services:
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: ${COMPOSE_PROJECT_NAME}-pgbouncer
    networks:
      - app
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - pgbouncer_credentials
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432"]
    restart: unless-stopped
    mem_limit: 64m
    cpus: "0.25"
