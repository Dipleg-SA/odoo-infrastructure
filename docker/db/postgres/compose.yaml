volumes:
  pgdata:

services:
  postgres:
    # Imagen propia = postgres:17.10 + pgbackrest: archive_command lo
    # ejecuta el proceso de la base, así que el binario tiene que vivir acá.
    build: .
    # Tag por proyecto: el nombre de imagen es global al daemon, así que un tag
    # fijo deja que el build de un stack pise la imagen que corre el otro.
    image: local/postgres:${COMPOSE_PROJECT_NAME}
    # Nombre derivado del proyecto: predecible y sin el sufijo -1 del autonaming,
    # pero sin colisionar si se levanta un segundo stack con otro nombre de proyecto.
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    networks:
      - app
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      # Ruta absoluta: conf.d es el include path por defecto de pgBackRest, que
      # fusiona este archivo con pgbackrest.conf sin necesidad de flags.
      - source: pgbackrest_r2_credentials
        target: /etc/pgbackrest/conf.d/r2.conf
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "odoo"]
    restart: unless-stopped
    # --- Presupuesto de memoria ---
    # Fijo, no por deployment: nunca se tocó en ningún .env.*.example real. Un
    # servidor chico o una laptop que necesiten menos, se edita acá directo.
    mem_limit: 2g
    cpus: "2.0"
