# --- Emisión y renovación de certificados ---
# profiles lo deja fuera de `make up`: corre como one-off, a mano la primera vez
# y por timer de systemd después. DNS-01 y no HTTP-01 para que la emisión no
# dependa del ingreso — el certificado se emite aunque el borde esté roto.
#
# Stack propio y no un servicio adentro de nginx: tiene imagen, script, secret,
# unit y verificación propios. El volumen letsencrypt lo declara el entorno,
# porque lo comparte con nginx — certbot escribe, nginx lee.
services:
  certbot:
    build:
      context: ./image
    # Tag por proyecto: el nombre de imagen es global al daemon, así que un tag
    # fijo deja que el build de un stack pise la imagen que corre el otro.
    image: local/certbot:${COMPOSE_PROJECT_NAME}
    container_name: ${COMPOSE_PROJECT_NAME}-certbot
    profiles: [cert]
    networks:
      - edge
    secrets:
      - cloudflare_api_token
    volumes:
      - letsencrypt:/etc/letsencrypt
      - ./scripts/wrapper.sh:/usr/local/bin/wrapper.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/wrapper.sh"]
    mem_limit: 256m
    cpus: "0.50"
