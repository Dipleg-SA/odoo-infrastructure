# --- Emisión y renovación de certificados ---
# El perfil cert lo reserva para one-off manuales y el timer de systemd.
services:
  certbot:
    build:
      context: ./image
    # Tag por proyecto: el nombre de imagen es global al daemon, así que un tag
    # fijo deja que el build de un stack pise la imagen que corre el otro.
    image: local/certbot:${COMPOSE_PROJECT_NAME}
    container_name: ${COMPOSE_PROJECT_NAME}-certbot
    profiles: [cert]
    networks:
      - edge
    secrets:
      - cloudflare_api_token
    volumes:
      - letsencrypt:/etc/letsencrypt
      - ./scripts/wrapper.sh:/usr/local/bin/wrapper.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/wrapper.sh"]
    mem_limit: 256m
    cpus: "0.50"
