volumes:
  odoo-data:

services:
  odoo:
    # Imagen declarada por el estado del runtime
    # La aplicación manual fija ODOO_IMAGE antes de levantar Compose.
    image: ${ODOO_IMAGE:?falta ODOO_IMAGE}
    # Nombre derivado del proyecto: predecible y sin el sufijo -1 del autonaming,
    # pero sin colisionar si se levanta un segundo stack con otro nombre de proyecto.
    container_name: ${COMPOSE_PROJECT_NAME}-odoo
    networks:
      - app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: postgres
      PORT: 5432
      USER: odoo
      PASSWORD_FILE: /run/secrets/postgres_password
      # El entrypoint los appendea a odoo.conf en runtime — mismo mecanismo que
      # admin_passwd, para no repetir el mismo valor a mano en dos archivos.
      # Sin default: vacíos acá no rompen nada, ODOO_DISABLE_SMTP gana en
      # development/staging y el operador los carga en .env solo en producción.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
    secrets:
      - postgres_password
      - odoo_admin_password
      - zeptomail_smtp_password
    volumes:
      - odoo-data:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8069/web/health?db_server_status=1"]
      start_period: 90s
    restart: unless-stopped
    # --- Presupuesto de memoria ---
    # Fijo, no por deployment: nunca se tocó en ningún .env.*.example real. Un
    # servidor chico o una laptop que necesiten menos, se edita acá directo.
    mem_limit: 5g
    cpus: "4.0"
