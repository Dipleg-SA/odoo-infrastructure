# --- Agente único ---
# Embebe node_exporter, cAdvisor y el exporter de Postgres, y además manda los logs.
volumes:
  alloy-data:

services:
  alloy:
    build:
      context: ./image
    # Tag por proyecto: el nombre de imagen es global al daemon, así que un tag
    # fijo deja que el build de un stack pise la imagen que corre el otro.
    image: local/alloy:${COMPOSE_PROJECT_NAME}
    # El hostname es de dónde sale la etiqueta instance de todas las métricas que
    # empuja: derivarlo del proyecto evita que dos stacks emitan series idénticas.
    hostname: ${COMPOSE_PROJECT_NAME}
    container_name: ${COMPOSE_PROJECT_NAME}-alloy
    # Red de aplicación
    # Permite que el exporter de Postgres alcance el servicio por nombre.
    networks:
      - observability
      - app
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    secrets:
      - postgres_exporter_password
    # --- Acceso al host ---
    # Los colectores leen el host real mediante montajes de solo lectura.

    volumes:
      - ${RUNTIME_CONFIG_DIR:?falta RUNTIME_CONFIG_DIR}/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${RUNTIME_STATE_DIR:?falta RUNTIME_STATE_DIR}/textfile:/textfile:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Socket de containerd
      # Permite que cAdvisor enumere los contenedores y sus métricas.
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      # No se monta /var/run completo para preservar la creación de secretos.
      # El socket de Docker ya está montado de forma explícita.

    # Dispositivo de cAdvisor
    # /dev/kmsg cubre el único acceso privilegiado que necesita el colector.
    devices:
      - /dev/kmsg
    # Healthcheck local
    # Bash consulta la API de Alloy sin agregar herramientas a la imagen.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\r\n\r\n' >&3 && grep -q '200 OK' <&3
    # Límite de privilegios
    # Root solo conserva lectura de los montajes del host y acceso al dispositivo requerido por cAdvisor.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 512m
    # CPU acotada
    # El límite evita que la observabilidad compita con Odoo y Postgres.
    cpus: "0.5"
