# --- Agente único ---
# Embebe node_exporter, cAdvisor y el exporter de Postgres, y además manda los logs.
# Corre como root (imagen) pero NO privilegiado: los colectores necesitan el host, no capacidades.
services:
  alloy:
    build:
      context: ./image
    # Tag por proyecto: el nombre de imagen es global al daemon, así que un tag
    # fijo deja que el build de un stack pise la imagen que corre el otro.
    image: local/alloy:${COMPOSE_PROJECT_NAME}
    # El hostname es de dónde sale la etiqueta instance de todas las métricas que
    # empuja: derivarlo del proyecto evita que dos stacks emitan series idénticas.
    hostname: ${COMPOSE_PROJECT_NAME}
    container_name: ${COMPOSE_PROJECT_NAME}-alloy
    # Red app además de observability: alcanza a Postgres por nombre.
    networks:
      - observability
      - app
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    secrets:
      - postgres_exporter_password
    # --- Acceso al host ---
    # Todo :ro salvo el config propio. Los colectores de host/contenedores leen el
    # host real, no el namespace del contenedor; sin esto miden el contenedor mismo.

    volumes:
      - ./config/config.alloy:/etc/alloy/config.alloy:ro
      - ../../state/textfile:/textfile:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # containerd: sin esto cAdvisor no enumera contenedores y emite series anónimas.
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      # /var/run entero NO se monta: es symlink a /run, y en :ro impide que Docker
      # cree /run/secrets. El socket, que es lo que cAdvisor usa, va montado arriba.
    # /dev/kmsg en vez de privileged: es lo único del privilegio que cAdvisor realmente usa.
    devices:
      - /dev/kmsg
    # La imagen no trae wget ni curl; bash sí, y /dev/tcp alcanza para hablar HTTP.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\r\n\r\n' >&3 && grep -q '200 OK' <&3
    restart: unless-stopped
    mem_limit: 512m
    # CPU acotada a propósito: el cAdvisor suelto de la infra vieja mide 21.9% sin límite.
    cpus: "0.5"
