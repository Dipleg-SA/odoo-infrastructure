# --- Server sin TLS: solo development ---
# Publica en loopback de la máquina del operador, sin certificado ni hostname.
# El proxy existe igual para que proxy_mode = True no mienta en ningún entorno:
# las cabeceras X-Forwarded-* las escribe este bloque, como en producción.

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  access_log /dev/stdout json_odoo;

  include /etc/nginx/conf.d/odoo.locations;
}
