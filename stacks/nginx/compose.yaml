# --- Proxy ---
# nginx es el único reverse proxy del stack: termina TLS, rutea el bus a su
# puerto propio y aplica el rate-limit del login.
#
# La llevan LOS TRES entornos. Development no tiene túnel ni certificados, pero
# sí proxy: es lo que hace honesto al proxy_mode = True de odoo.conf, que sin
# nadie escribiendo X-Forwarded-* confía en cabeceras que no existen.
services:
  nginx:
    build:
      context: ./image
    # Tag por proyecto: el nombre de imagen es global al daemon, así que un tag
    # fijo deja que el build de un stack pise la imagen que corre el otro.
    image: local/nginx:${COMPOSE_PROJECT_NAME}
    # Nombre derivado del proyecto: predecible y sin el sufijo -1 del autonaming,
    # pero sin colisionar si se levanta un segundo stack con otro nombre de proyecto.
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    networks:
      - edge
      - app
    # Publicación declarada por runtime
    # Cada entorno define sus puertos; cloudflared llega por la red edge.

    # Configuración del runtime
    # Los archivos con valores privados viven bajo runtime/<entorno>/config/nginx/.

    volumes:
      - ${RUNTIME_CONFIG_DIR:?falta RUNTIME_CONFIG_DIR}/nginx/00-http.conf:/etc/nginx/conf.d/00-http.conf:ro
      - ${RUNTIME_CONFIG_DIR:?falta RUNTIME_CONFIG_DIR}/nginx/odoo.locations:/etc/nginx/conf.d/odoo.locations:ro
      - ${RUNTIME_CONFIG_DIR:?falta RUNTIME_CONFIG_DIR}/nginx/addons-webhook.locations:/etc/nginx/conf.d/addons-webhook.locations:ro
      - ${RUNTIME_CONFIG_DIR:?falta RUNTIME_CONFIG_DIR}/nginx/server-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.50"

# El volumen letsencrypt NO se declara acá: lo comparte con el stack certbot, que
# escribe lo que este lee. Lo compartido lo declara el entorno, como redes y
# secrets — dos declaraciones divergentes del mismo recurso se fusionan en
# silencio, con exit 0.
