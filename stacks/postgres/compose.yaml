volumes:
  pgdata:

services:
  postgres:
    build:
      context: ./image
    # Tag por proyecto: el nombre de imagen es global al daemon, así que un tag
    # fijo deja que el build de un stack pise la imagen que corre el otro.
    image: local/postgres:${COMPOSE_PROJECT_NAME}
    # Nombre derivado del proyecto: predecible y sin el sufijo -1 del autonaming,
    # pero sin colisionar si se levanta un segundo stack con otro nombre de proyecto.
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    networks:
      - app
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Donde pg_dump escribe para que el backup lo meta en el mismo snapshot que
      # el filestore. Lo declara el entorno: lo comparte con el stack backup, que
      # lo lee. Un entorno sin backup simplemente no lo declara ni lo monta.
      - dumps:/dumps
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "odoo"]
    restart: unless-stopped
    # --- Presupuesto de memoria ---
    # Fijo, no por deployment: nunca se tocó en ningún .env.*.example real. Un
    # servidor chico o una laptop que necesiten menos, se edita acá directo.
    mem_limit: 2g
    cpus: "2.0"
