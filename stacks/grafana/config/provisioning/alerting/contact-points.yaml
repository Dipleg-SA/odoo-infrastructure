# --- Contact point de email ---
# Reusa el SMTP configurado en grafana.ini (ZeptoMail). ${ALERT_EMAIL_TO} lo
# expande Grafana mismo al leer el provisioning —no envsubst externo— desde el
# ALERT_EMAIL_TO que compose.yaml le pasa por entorno, el mismo valor que ya
# usa failure-notify.sh. Sin valores por deployment: se versiona tal cual.

apiVersion: 1

contactPoints:
  - orgId: 1
    name: email-operador
    receivers:
      - uid: email-operador
        type: email
        settings:
          addresses: ${ALERT_EMAIL_TO}
          singleEmail: false
