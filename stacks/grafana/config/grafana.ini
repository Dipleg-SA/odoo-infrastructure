; --- Identidad del servidor ---
; root_url importa para los enlaces dentro de los mails de alerta; se llega por túnel SSH.

[server]
root_url = http://localhost:3000

; --- Credencial de admin ---
; $__file{} es la única forma de leer de archivo: Grafana NO soporta sufijo __FILE en env vars.

[security]
admin_user = admin
admin_password = $__file{/run/secrets/grafana_admin_password}

; --- Anonimato y registro ---
; Operador único: sin registro, sin usuarios anónimos.

[users]
allow_sign_up = false

; --- SMTP ---
; enabled/host/user/from_address llegan por GF_SMTP_* en compose.yaml, desde
; SMTP_HOST/SMTP_PORT/SMTP_USER/ALERT_EMAIL_FROM en .env — el mismo valor que ya
; usan odoo y failure-notify.sh, sin repetirlo acá. La password sigue $__file{}
; en vez de GF_SMTP_PASSWORD: no hay forma segura de pasarla por env var.

[smtp]
password  = $__file{/run/secrets/zeptomail_smtp_password}
from_name = Grafana - infra Odoo

; --- Sin valores por deployment ---
; Nada de lo que queda arriba varía entre checkouts: este archivo se versiona
; tal cual, no como plantilla — una plantilla de sí mismo es una copia que se
; desincroniza (PRINCIPLES.md).
