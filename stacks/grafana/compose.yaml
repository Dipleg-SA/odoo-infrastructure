# --- Consulta y alerting ---
# Único servicio con puerto publicado: UI administrativa, nivel 2 (loopback + túnel SSH).
volumes:
  grafana-data:

services:
  grafana:
    build:
      context: ./image
    # Tag por proyecto: el nombre de imagen es global al daemon, así que un tag
    # fijo deja que el build de un stack pise la imagen que corre el otro.
    image: local/grafana:${COMPOSE_PROJECT_NAME}
    container_name: ${COMPOSE_PROJECT_NAME}-grafana
    networks:
      - observability
    ports:
      - "127.0.0.1:3001:3000"
    # Corre 472:0, así que los grupos de los dos secrets llegan como suplementarios:
    # 472 el suyo propio, 101 el de odoo, dueño del secret de SMTP que reusa.
    group_add:
      - "472"
      - "101"
    secrets:
      - grafana_admin_password
      - zeptomail_smtp_password
    # --- SMTP y destinatario, desde .env ---
    # GF_SMTP_* pisa grafana.ini —mecanismo nativo de Grafana, no envsubst—, y
    # ALERT_EMAIL_TO lo expande Grafana mismo en contact-points.yaml. Mismos
    # valores que ya usan odoo y failure-notify.sh: un lugar donde cargarlos,
    # no tres. La password sigue por $__file{} en grafana.ini: no hay forma
    # segura de pasarla por env var.
    environment:
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "${SMTP_HOST:-}:${SMTP_PORT:-587}"
      GF_SMTP_USER: ${SMTP_USER:-}
      GF_SMTP_FROM_ADDRESS: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}

    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./config/provisioning:/etc/grafana/provisioning:ro
      - ./config/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"
