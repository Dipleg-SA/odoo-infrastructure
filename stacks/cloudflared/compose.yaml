# --- Túnel ---
# El túnel recibe el ingreso público y alcanza nginx por la red edge interna.
services:
  cloudflared:
    build:
      context: ./image
    # Tag por proyecto: el nombre de imagen es global al daemon, así que un tag
    # fijo deja que el build de un stack pise la imagen que corre el otro.
    image: local/cloudflared:${COMPOSE_PROJECT_NAME}
    command: tunnel --metrics 0.0.0.0:2000 run
    container_name: ${COMPOSE_PROJECT_NAME}-cloudflared
    networks:
      - edge
    # Secreto del runtime
    # El Compose padre resuelve la credencial desde runtime/<entorno>/secrets/.
    secrets:
      - cloudflare_tunnel_token
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tunnel_token
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
    restart: unless-stopped
    mem_limit: 64m
    cpus: "0.15"
