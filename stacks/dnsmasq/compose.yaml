# --- DNS local ---
# Resuelve el hostname público a la IP de la LAN, para que los equipos de la red
# no salgan a internet para llegar a un servidor que tienen al lado.
#
# profiles: [lan] — solo tiene sentido con servidor local. Un deploy en VPS no
# tiene LAN: todos los usuarios son remotos y el tráfico sale por el túnel igual.
# Se activa con COMPOSE_PROFILES=lan en el compose.env del runtime.
# El mismo stack se comparte entre todos los entornos.
#
# Corre en network_mode: host sobre el 53, así que es el único servicio del stack
# que no admite una segunda instancia de ninguna forma.
#
# No alcanza con levantarlo: quién resuelve para la LAN lo decide el DHCP de la
# red, no este archivo. Sin ese paso dnsmasq queda sano y sin consultarlo nadie.
services:
  dnsmasq:
    build:
      context: ./image
    # Tag por proyecto: el nombre de imagen es global al daemon, así que un tag
    # fijo deja que el build de un stack pise la imagen que corre el otro.
    image: local/dnsmasq:${COMPOSE_PROJECT_NAME}
    container_name: ${COMPOSE_PROJECT_NAME}-dnsmasq
    profiles: [lan]
    # network_mode: host — bindea directo en ${LOCAL_IP}:53 para evitar el
    # conflicto con systemd-resolved y el NAT/ufw del publish de Docker.
    network_mode: host
    # Configuración del runtime
    # El archivo se inicializa desde su .example bajo runtime/<entorno>/config/.

    command: ["--conf-file=/etc/dnsmasq.conf"]
    volumes:
      - ${RUNTIME_CONFIG_DIR:?falta RUNTIME_CONFIG_DIR}/dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro
    # Corre como root porque el 53 es puerto privilegiado y usa el stack de red
    # del host; dnsmasq baja de privilegios por su cuenta después de bindear.
    healthcheck:
      test: ["CMD-SHELL", "nslookup ${PUBLIC_HOSTNAME} ${LOCAL_IP} | grep -q ${LOCAL_IP}"]
    restart: unless-stopped
    mem_limit: 32m
    cpus: "0.10"
