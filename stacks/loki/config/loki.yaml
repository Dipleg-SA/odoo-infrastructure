# --- Modo de despliegue ---
# Single-binary sobre filesystem: un solo operador, un solo servidor, sin anillo distribuido.

auth_enabled: false

server:
  http_listen_port: 3100
  log_level: info

common:
  path_prefix: /loki
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  ring:
    kvstore:
      store: inmemory

# --- Esquema ---
# TSDB v13, el único que soporta metadata estructurada; el índice rota cada 24h.

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# --- Retención ---
# Llega por .env (requiere -config.expand-env en el command). Alineada con la
# ventana de métricas por consistencia, no por necesidad técnica: esto es una
# herramienta de diagnóstico, no de restauración, y nada se rompe si difieren.

limits_config:
  retention_period: 3000h

# --- Quien aplica la retención ---
# Sin el compactor con retention_enabled, retention_period es un número decorativo.

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
