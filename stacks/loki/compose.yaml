# --- Almacén de logs ---
# Single-binary sobre filesystem: sin anillo distribuido, un solo operador.
volumes:
  loki-data:

services:
  loki:
    build:
      context: ./image
    # Tag por proyecto: el nombre de imagen es global al daemon, así que un tag
    # fijo deja que el build de un stack pise la imagen que corre el otro.
    image: local/loki:${COMPOSE_PROJECT_NAME}
    container_name: ${COMPOSE_PROJECT_NAME}-loki
    networks:
      - observability
    volumes:
      - loki-data:/loki
      - ${RUNTIME_CONFIG_DIR:?falta RUNTIME_CONFIG_DIR}/loki/loki.yaml:/etc/loki/loki.yaml:ro
    command: ["-config.file=/etc/loki/loki.yaml"]
    # No tiene healthcheck porque la imagen distroless no trae un binario auxiliar.
    # Prometheus verifica su disponibilidad y genera la alerta correspondiente.
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
