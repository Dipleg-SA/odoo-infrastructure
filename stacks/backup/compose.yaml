# --- Respaldos ---
# Un contenedor cubre backup y restore sobre el mismo repositorio.
services:
  backup:
    build:
      context: ./image
    # Tag por proyecto: el nombre de imagen es global al daemon, así que un tag
    # fijo evitaría que un build pise la imagen de otro proyecto.
    image: local/backup:${COMPOSE_PROJECT_NAME}
    # Identifica el grupo de retención de restic por proyecto.
    # Evita grupos huérfanos y colisiones entre checkouts.
    hostname: ${COMPOSE_PROJECT_NAME}
    # Nombre derivado del proyecto
    # Evita el sufijo autonumérico y colisiones entre proyectos.
    container_name: ${COMPOSE_PROJECT_NAME}-backup
    # --- Usuario ---
    # La operación recurrente usa uid/gid de Odoo; restore eleva solo su invocación.
    user: "100:101"
    # Proceso persistente
    # Permite que el healthcheck consulte el repositorio real.
    entrypoint: ["sleep"]
    command: ["infinity"]
    networks:
      - app
    # El repositorio real vive en el archivo privado de cada checkout.
    # Su ausencia no rompe Compose; la detecta el verificador.
    env_file:
      - path: ./config/r2.env
        required: false
    environment:
      # Rutas de secretos
      # Los valores no se interpolan en variables del servicio.
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/restic_r2_credentials
      # Caché descartable
      # /tmp evita cambiar ownership de un volumen persistente.
      HOME: /tmp
      RESTIC_CACHE_DIR: /tmp/restic-cache
      # Umbral del healthcheck
      # Debe acompañar la cadencia de backup-daily.timer.
      RESTIC_MAX_AGE: 129600
    secrets:
      - restic_password
      - restic_r2_credentials
    volumes:
      # El volumen es rw porque el mismo contenedor ejecuta restore.
      # La separación por proyecto evita compartir repositorio entre runtimes.
      - odoo-data:/data/odoo
      # Dump compartido
      # Restore repone el archivo antes de cargarlo en Postgres.
      - dumps:/data/dump
      # Metadatos del runtime
      # Addons e imágenes viajan en el snapshot; los scripts corren en el host.
      - ${RUNTIME_STATE_DIR:?falta RUNTIME_STATE_DIR}/meta:/data/meta:rw
    # Healthcheck de repositorio y frescura
    # Detecta tanto fallos de backup como ausencia de corridas recientes.
    healthcheck:
      test:
        - CMD-SHELL
        - |
          ts=$$(restic snapshots --latest 1 --json | grep -o '"time":"[^"]*"' | tail -1 | cut -d'"' -f4)
          [ -n "$$ts" ] || exit 1
          norm=$$(echo "$$ts" | sed 's/T/ /; s/\..*//; s/Z//')
          age=$$(( $$(date -u +%s) - $$(date -u -d "$$norm" +%s) ))
          [ "$$age" -lt $$RESTIC_MAX_AGE ]
      interval: 1h
      timeout: 60s
      start_period: 5m
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
