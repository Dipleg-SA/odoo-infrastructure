# Capa de observability. Cuatro servicios: Prometheus y Loki almacenan,
# Grafana consulta y alerta, Alloy es el único agente (métricas de host/contenedores/base + logs).
volumes:
  prometheus-data:
  loki-data:
  grafana-data:

services:
  prometheus:
    image: prom/prometheus:v3.13.2
    # Nombre derivado del proyecto: predecible y sin el sufijo -1 del autonaming,
    # pero sin colisionar si se levanta un segundo stack con otro nombre de proyecto.
    container_name: ${COMPOSE_PROJECT_NAME}-prometheus
    # Red edge además de observability: scrapea cloudflared por nombre.
    networks:
      - observability
      - edge
    volumes:
      - prometheus-data:/prometheus
      - ./config/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    # --- Techos y receptor de push ---
    # Techo por tiempo Y por tamaño: el segundo es el fusible si la cardinalidad supera lo estimado.
    # Repetir los dos flags de path es obligatorio: pasar command: pisa los defaults de la imagen.

    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${METRICS_RETENTION:-125d}
      - --storage.tsdb.retention.size=${METRICS_MAX_SIZE:-20GB}
      - --web.enable-remote-write-receiver
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"

  # --- Almacén de logs ---
  # Single-binary sobre filesystem: sin anillo distribuido, un solo operador.

  loki:
    image: grafana/loki:3.7.6
    container_name: ${COMPOSE_PROJECT_NAME}-loki
    networks:
      - observability
    volumes:
      - loki-data:/loki
      - ./config/loki/loki.yaml:/etc/loki/loki.yaml:ro
    # La expansión la hace Loki desde SU entorno, no Compose sobre el archivo: sin
    # este environment la variable no existe adentro y siempre gana el default.
    environment:
      LOGS_RETENTION: ${LOGS_RETENTION:-3000h}
    # expand-env: sin esta flag, Loki no interpola ${VAR} dentro de su propio archivo.
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
    # Sin healthcheck: la imagen es distroless estricta (solo /usr/bin/loki), no hay
    # binario para ejecutar uno. El caso "vivo pero no sirve" lo cubre up == 0 en
    # Prometheus, que lo scrapea directo, y de ahí sale la alerta de servicio caído.
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"

  # --- Consulta y alerting ---
  # Único servicio con puerto publicado: UI administrativa, nivel 2 (loopback + túnel SSH).

  grafana:
    image: grafana/grafana:13.1.2
    container_name: ${COMPOSE_PROJECT_NAME}-grafana
    networks:
      - observability
    ports:
      - "127.0.0.1:3000:3000"
    # Corre 472:0, así que los grupos de los dos secrets llegan como suplementarios:
    # 472 el suyo propio, 101 el de odoo, dueño del secret de SMTP que reusa.
    group_add:
      - "472"
      - "101"
    secrets:
      - grafana_admin_password
      - zeptomail_smtp_password
    # --- Valores por deployment ---
    # GF_* pisan grafana.ini; ALERT_EMAIL_TO lo interpola Grafana al leer el provisioning de alerting.

    environment:
      GF_SMTP_HOST: ${SMTP_HOST:-}:${SMTP_PORT:-587}
      GF_SMTP_USER: ${SMTP_USER:-}
      GF_SMTP_FROM_ADDRESS: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"

  # --- Agente único ---
  # Embebe node_exporter, cAdvisor y el exporter de Postgres, y además manda los logs.
  # Corre como root (imagen) pero NO privilegiado: los colectores necesitan el host, no capacidades.

  alloy:
    image: grafana/alloy:v1.18.1
    # El hostname es de dónde sale la etiqueta instance de todas las métricas que
    # empuja: derivarlo del proyecto evita que dos stacks emitan series idénticas.
    hostname: ${COMPOSE_PROJECT_NAME}
    container_name: ${COMPOSE_PROJECT_NAME}-alloy
    # Red app además de observability: alcanza a Postgres por nombre.
    networks:
      - observability
      - app
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    secrets:
      - postgres_exporter_password
    # --- Acceso al host ---
    # Todo :ro salvo el config propio. Los colectores de host/contenedores leen el
    # host real, no el namespace del contenedor; sin esto miden el contenedor mismo.

    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./state/textfile:/textfile:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # containerd: sin esto cAdvisor no enumera contenedores y emite series anónimas.
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      # /var/run entero NO se monta: es symlink a /run, y en :ro impide que Docker
      # cree /run/secrets. El socket, que es lo que cAdvisor usa, va montado arriba.
    # /dev/kmsg en vez de privileged: es lo único del privilegio que cAdvisor realmente usa.
    devices:
      - /dev/kmsg
    # La imagen no trae wget ni curl; bash sí, y /dev/tcp alcanza para hablar HTTP.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\r\n\r\n' >&3 && grep -q '200 OK' <&3
    restart: unless-stopped
    mem_limit: 512m
    # CPU acotada a propósito: el cAdvisor suelto de la infra vieja mide 21.9% sin límite.
    cpus: "0.5"
