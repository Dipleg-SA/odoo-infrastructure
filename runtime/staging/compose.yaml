# Identidad propia del entorno
# El nombre separa contenedores, redes y volúmenes de los otros runtimes.
name: ${COMPOSE_PROJECT_NAME:?falta COMPOSE_PROJECT_NAME}

# Recursos compartidos por los stacks de staging
# Compose les agrega el nombre del proyecto para mantenerlos aislados.
networks:
  edge:
  app:

volumes:
  letsencrypt:
  dumps:

# Secretos privados del entorno
# Los valores se inicializan con secrets-init y no se versionan.
secrets:
  cloudflare_api_token:
    file: ${RUNTIME_SECRETS_DIR:?falta RUNTIME_SECRETS_DIR}/cloudflare_api_token
  cloudflare_tunnel_token:
    file: ${RUNTIME_SECRETS_DIR:?falta RUNTIME_SECRETS_DIR}/cloudflare_tunnel_token
  postgres_password:
    file: ${RUNTIME_SECRETS_DIR:?falta RUNTIME_SECRETS_DIR}/postgres_password
  odoo_admin_password:
    file: ${RUNTIME_SECRETS_DIR:?falta RUNTIME_SECRETS_DIR}/odoo_admin_password
  zeptomail_smtp_password:
    file: ${RUNTIME_SECRETS_DIR:?falta RUNTIME_SECRETS_DIR}/zeptomail_smtp_password
  restic_password:
    file: ${RUNTIME_SECRETS_DIR:?falta RUNTIME_SECRETS_DIR}/restic_password
  restic_r2_credentials:
    file: ${RUNTIME_SECRETS_DIR:?falta RUNTIME_SECRETS_DIR}/restic_r2_credentials

# Stacks incluidos en staging
# Este entorno conserva restore y el acceso por túnel, sin observabilidad ni DNS local.
include:
  - ../../stacks/nginx/compose.yaml
  - ../../stacks/certbot/compose.yaml
  - ../../stacks/cloudflared/compose.yaml
  - ../../stacks/postgres/compose.yaml
  - ../../stacks/odoo/compose.yaml
  - ../../stacks/backup/compose.yaml

# Ajustes propios del entorno
# Staging expone el proxy solo en loopback y mantiene desactivado el SMTP de Odoo.
services:
  nginx:
    ports:
      - "127.0.0.1:${HTTP_PORT:?falta HTTP_PORT}:80"
      - "127.0.0.1:${HTTPS_PORT:?falta HTTPS_PORT}:443"
    volumes:
      - ${RUNTIME_CONFIG_DIR:?falta RUNTIME_CONFIG_DIR}/nginx/server-tls.conf:/etc/nginx/conf.d/default.conf:ro
  odoo:
    environment:
      ODOO_DISABLE_SMTP: "1"
    secrets: !override
      - postgres_password
      - odoo_admin_password
      - zeptomail_smtp_password
  backup:
    profiles: [restore]
