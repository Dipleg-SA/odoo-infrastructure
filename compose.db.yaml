volumes:
  pgdata:

services:
  postgres:
    # Imagen propia = postgres:17.10 + pgbackrest: archive_command lo
    # ejecuta el proceso de la base, así que el binario tiene que vivir acá.
    build: ./docker/postgres
    # Tag por proyecto: el nombre de imagen es global al daemon, así que un tag
    # fijo deja que el build de un stack pise la imagen que corre el otro.
    image: local/postgres:${COMPOSE_PROJECT_NAME}
    # Nombre derivado del proyecto: predecible y sin el sufijo -1 del autonaming,
    # pero sin colisionar si se levanta un segundo stack con otro nombre de proyecto.
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    networks:
      - app
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # Valores por deployment; el entorno pisa al archivo opción por opción.
      # Con default vacío: un stack que no archiva ni restaura no los declara. Que
      # el que sí lo hace los tenga cargados lo exige verify-db, no la interpolación.
      PGBACKREST_STANZA: ${PGBACKREST_STANZA:-}
      PGBACKREST_REPO1_S3_BUCKET: ${R2_BUCKET:-}
      PGBACKREST_REPO1_S3_ENDPOINT: ${R2_ENDPOINT:-}
      PGBACKREST_REPO1_RETENTION_FULL: ${BACKUP_RETENTION_DAYS:-125}
    secrets:
      - postgres_password
      # Ruta absoluta: conf.d es el include path por defecto de pgBackRest, que
      # fusiona este archivo con pgbackrest.conf sin necesidad de flags.
      - source: pgbackrest_r2_credentials
        target: /etc/pgbackrest/conf.d/r2.conf
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    # --- Archivado de WAL ---
    # Acá y no en postgresql.conf, que es el mismo para los tres: un stack sin backups lo pone en off.

    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c archive_mode=${PG_ARCHIVE_MODE:-on}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "odoo"]
    restart: unless-stopped
    # --- Presupuesto de memoria ---
    # El default es un punto de partida; se ajusta por .env sin tocar este archivo.
    mem_limit: ${POSTGRES_MEM_LIMIT:-2g}
    cpus: "2.0"

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: ${COMPOSE_PROJECT_NAME}-pgbouncer
    networks:
      - app
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - pgbouncer_credentials
    volumes:
      - ./config/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432"]
    restart: unless-stopped
    mem_limit: 64m
    cpus: "0.25"
