# Entrypoint de producción: borde completo, datos y aplicación. Es el caso base —
# no lleva bloque `services:` porque no se aparta de nada: nginx publica en la LAN,
# NGINX_MODE cae a tls y Odoo manda correo. Los !override son de los otros entornos.
#
# El nombre del stack NO se declara acá — sale de COMPOSE_PROJECT_NAME en .env,
# junto a COMPOSE_FILE, para que los entornos usen el mismo mecanismo.
#
# dnsmasq entra solo si el .env de este checkout trae COMPOSE_PROFILES=lan: un
# deploy en VPS no tiene red local que resolver.

networks:
  edge:
  app:
  observability:

# --- Volumen compartido ---
# certbot escribe el certificado, nginx lo lee :ro. Lo declara el entorno y no
# uno de los dos stacks, como redes y secrets: dos declaraciones divergentes del
# mismo recurso se fusionan en silencio, con exit 0.

volumes:
  letsencrypt:
  # postgres escribe el dump acá, backup lo lee para meterlo en el mismo snapshot
  # que el filestore. Compartido entre dos stacks, así que lo declara el entorno.
  dumps:

# --- Solo los secrets de los stacks que lleva ---
# Compose falla si un `file:` declarado no existe, y declarar de más obliga a
# fabricar archivos inertes que secrets-check después exige completar.

secrets:
  cloudflare_api_token:
    file: ../secrets/cloudflare_api_token
  cloudflare_tunnel_token:
    file: ../secrets/cloudflare_tunnel_token
  postgres_password:
    file: ../secrets/postgres_password
  odoo_admin_password:
    file: ../secrets/odoo_admin_password
  zeptomail_smtp_password:
    file: ../secrets/zeptomail_smtp_password
  restic_password:
    file: ../secrets/restic_password
  restic_r2_credentials:
    file: ../secrets/restic_r2_credentials
  # Grafana corre 472:0, así que el grupo 472 del archivo le llega por group_add
  # en el servicio, no por su gid primario.
  grafana_admin_password:
    file: ../secrets/grafana_admin_password
  # Rol de solo lectura propio del monitoreo, no la credencial de la aplicación.
  postgres_exporter_password:
    file: ../secrets/postgres_exporter_password

include:
  - ../stacks/nginx/compose.yaml
  - ../stacks/certbot/compose.yaml
  - ../stacks/cloudflared/compose.yaml
  - ../stacks/dnsmasq/compose.yaml
  - ../stacks/postgres/compose.yaml
  - ../stacks/odoo/compose.yaml
  - ../stacks/backup/compose.yaml
  - ../stacks/prometheus/compose.yaml
  - ../stacks/loki/compose.yaml
  - ../stacks/grafana/compose.yaml
  - ../stacks/alloy/compose.yaml
