# Capa de backups. pgBackRest no aporta contenedor: vive dentro del de
# Postgres, porque archive_command lo ejecuta el proceso de la base.
services:
  backup:
    image: restic/restic:0.19.1
    # Hostname fijo: restic agrupa la retención por (host, paths) y sin esto Docker
    # usa el ID del contenedor, así que cada recreación deja un grupo sin purgar.
    hostname: odoo-prod
    # Nombre derivado del proyecto: predecible y sin el sufijo -1 del autonaming,
    # pero sin colisionar si se levanta un segundo stack con otro nombre de proyecto.
    container_name: ${COMPOSE_PROJECT_NAME}-backup
    # user 100:101 son los uid/gid de Odoo: /var/lib/odoo es 750, así que ni
    # siquiera un no-root cualquiera puede leerlo — tiene que ser exactamente ese.
    user: "100:101"
    # Proceso vivo para poder colgarle un healthcheck que verifique el repo real.
    entrypoint: ["sleep"]
    command: ["infinity"]
    networks:
      - app
    environment:
      RESTIC_REPOSITORY: s3:https://${R2_ENDPOINT}/${R2_BUCKET}/restic
      # Rutas, nunca valores: los principios prohíben secretos en variables.
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/restic_r2_credentials
      # Caché descartable en /tmp: un volumen nombrado nace root:root y obligaría
      # a un baile de ownership para algo que se puede reconstruir solo.
      HOME: /tmp
      RESTIC_CACHE_DIR: /tmp/restic-cache
      # Umbral del healthcheck: 36h = cadencia diaria + 12h de margen.
      RESTIC_MAX_AGE: ${RESTIC_MAX_AGE:-129600}
    secrets:
      - restic_password
      - restic_r2_credentials
    volumes:
      # Solo lectura: el único camino de escritura es el servicio de restore.
      - odoo-data:/data/odoo:ro
      # Registro de addons del snapshot; lo escribe backup.sh en el host.
      - ./state/meta:/data/meta:ro
    # Verifica repo alcanzable Y frescura: cubre tanto "el backup falló" como
    # "el backup nunca corrió", que el OnFailure= por definición no puede ver.
    healthcheck:
      test:
        - CMD-SHELL
        - |
          ts=$$(restic snapshots --latest 1 --json | grep -o '"time":"[^"]*"' | tail -1 | cut -d'"' -f4)
          [ -n "$$ts" ] || exit 1
          norm=$$(echo "$$ts" | sed 's/T/ /; s/\..*//; s/Z//')
          age=$$(( $$(date -u +%s) - $$(date -u -d "$$norm" +%s) ))
          [ "$$age" -lt $${RESTIC_MAX_AGE:-129600} ]
      interval: 1h
      timeout: 60s
      start_period: 5m
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"

  # --- Restore: solo a mano ---
  # profiles los deja fuera de `make up`, sin restart; único camino con escritura sobre pgdata/filestore.

  restore-db:
    # Mismo build e imagen que el servicio postgres: sin el build: aquí, un
    # restore-up antes del primer build intentaría bajar el tag de Docker Hub.
    build: ./docker/postgres
    image: local/postgres:local
    container_name: ${COMPOSE_PROJECT_NAME}-restore-db
    profiles: [restore]
    # Como postgres: pgbackrest tiene que escribir pgdata con el owner correcto.
    user: "999:999"
    entrypoint: ["sleep"]
    command: ["infinity"]
    networks:
      - app
    environment:
      PGBACKREST_STANZA: ${PGBACKREST_STANZA}
      PGBACKREST_REPO1_S3_BUCKET: ${R2_BUCKET}
      PGBACKREST_REPO1_S3_ENDPOINT: ${R2_ENDPOINT}
    secrets:
      - source: pgbackrest_r2_credentials
        target: /etc/pgbackrest/conf.d/r2.conf
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    # Mismos límites que postgres: durante un restore la base está detenida, así
    # que ocupa su lugar en el presupuesto en vez de sumarse.
    mem_limit: ${POSTGRES_MEM_LIMIT:-2g}
    cpus: "2.0"

  restore-files:
    image: restic/restic:0.19.1
    container_name: ${COMPOSE_PROJECT_NAME}-restore-files
    profiles: [restore]
    # Mismo uid/gid que Odoo: restaurar como root dejaría archivos que la
    # aplicación no puede leer ni pasar por el GC.
    user: "100:101"
    entrypoint: ["sleep"]
    command: ["infinity"]
    networks:
      - app
    environment:
      RESTIC_REPOSITORY: s3:https://${R2_ENDPOINT}/${R2_BUCKET}/restic
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/restic_r2_credentials
      HOME: /tmp
      RESTIC_CACHE_DIR: /tmp/restic-cache
    secrets:
      - restic_password
      - restic_r2_credentials
    volumes:
      # rw, a diferencia del servicio de backup.
      - odoo-data:/data/odoo
    mem_limit: 512m
    cpus: "1.0"
