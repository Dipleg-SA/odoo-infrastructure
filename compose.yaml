name: infrastructure-odoo

networks:
  edge:
  app:
  observability:

secrets:
  cloudflare_api_token:
    file: ./secrets/cloudflare_api_token
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare_tunnel_token
  postgres_password:
    file: ./secrets/postgres_password
  pgbouncer_credentials:
    file: ./secrets/pgbouncer_credentials
  odoo_admin_password:
    file: ./secrets/odoo_admin_password
  zeptomail_smtp_password:
    file: ./secrets/zeptomail_smtp_password
  # Spec 005. pgbackrest_r2_credentials lleva las claves de R2 y la passphrase de cifrado;
  # se monta en el include path por defecto de pgBackRest (ver compose.db.yaml),
  # no bajo /run/secrets, para que se fusione solo con pgbackrest.conf.
  pgbackrest_r2_credentials:
    file: ./secrets/pgbackrest_r2_credentials
  restic_password:
    file: ./secrets/restic_password
  restic_r2_credentials:
    file: ./secrets/restic_r2_credentials
  # Spec 006. Grafana corre 472:0, así que el grupo 472 del archivo le llega
  # por group_add en el servicio, no por su gid primario.
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  # Rol de solo lectura propio del monitoreo, no la credencial de la aplicación.
  postgres_exporter_password:
    file: ./secrets/postgres_exporter_password

include:
  - compose.dns.yaml
  - compose.edge.yaml
  - compose.db.yaml
  - compose.odoo.yaml
  - compose.backups.yaml
  - compose.restore.yaml
  - compose.observability.yaml
