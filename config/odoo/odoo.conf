[options]

; --- Servidor / proxy ---

proxy_mode          = True
dbfilter            = ^odoo$
list_db             = False
data_dir            = /var/lib/odoo

; --- Workers y límites (bytes) ---
; Por debajo de lo que da (cores*2)+1: esa fórmula asume la máquina entera para
; la aplicación. Los límites por proceso se eligen para que la suma de los hard
; entre en el mem_limit del contenedor con margen, y así el reciclado propio de
; Odoo gane al OOM-kill de Docker. Recalibrar junto con ese cap, no por separado.

workers             = 4
max_cron_threads    = 2
gevent_port         = 8072
limit_memory_soft   = 805306368
limit_memory_hard   = 939524096

; --- Módulos cargados server-wide ---
; bus_alt_connection NO es opcional: el pooler corre en modo transacción, eso
; rompe LISTEN/NOTIFY, y este módulo le da al bus su propia conexión directa.
; Sin él Odoo arranca igual y el chat en tiempo real deja de actualizarse solo.
; Tiene que estar declarado en el manifiesto de addons; lo verifica make verify-odoo.

server_wide_modules = base,web,bus_alt_connection

; --- Bus alternativo (long-polling), su propia conexión a Postgres ---

imdispatcher_db_host = postgres
imdispatcher_db_port = 5432

; --- SMTP saliente ---
; STARTTLS. El host y el puerto los appendea el entrypoint desde .env: cuál
; proveedor transaccional se use es decisión de cada deployment.

smtp_ssl            = True

; --- Inyectado en runtime, no editar a mano ---

; addons_path                -> generado por el entrypoint (glob por categoría)
; admin_passwd               -> inyectado por el entrypoint desde secret
; smtp_server/port/user      -> inyectados por el entrypoint desde .env
; smtp_password              -> inyectado por el entrypoint desde secret (si existe)
; db_host/port/user/password -> vía env (HOST/PORT/USER/PASSWORD_FILE) + entrypoint oficial
