[databases]
* = host=postgres port=5432

[pgbouncer]

; --- Listen / pooling ---

listen_addr               = *
listen_port               = 6432
pool_mode                 = transaction
default_pool_size         = 10
max_client_conn           = 100
ignore_startup_parameters = extra_float_digits

; --- Autenticación ---
; auth_type = plain: la contraseña queda en texto plano dentro del auth_file. Se
; acepta porque el archivo es un secret 640 con el GID del proceso que lo lee y
; PgBouncer no publica puerto. La alternativa es auth_query, que consulta la
; contraseña a Postgres y evita la copia — ver docs/architecture.md.

auth_type = plain
auth_file = /run/secrets/pgbouncer_credentials
