[databases]
* = host=postgres port=5432

[pgbouncer]

; --- Listen / pooling ---

listen_addr               = *
listen_port               = 6432
pool_mode                 = transaction
default_pool_size         = 10
max_client_conn           = 100
ignore_startup_parameters = extra_float_digits

; --- Autenticación ---
; ponytail: password en texto plano (mitigado por secrets 640/GID + red interna); migrar a auth_query para rotar.

auth_type = plain
auth_file = /run/secrets/pgbouncer_credentials
