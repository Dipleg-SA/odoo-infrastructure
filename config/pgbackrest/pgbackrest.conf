# Config no sensible de pgBackRest. Las claves de R2 y la passphrase de cifrado
# llegan aparte, por el secret montado en /etc/pgbackrest/conf.d/r2.conf.
# No hay sección por stanza: el nombre, pg1-path y pg1-user llegan por PGBACKREST_*
# desde Compose, así el nombre de la stanza no vive en dos archivos que puedan divergir.
# Los comentarios van con '#': pgBackRest no acepta ';' (a diferencia de PgBouncer).

[global]

# --- Repositorio (Cloudflare R2, S3-compatible) ---
# Bucket y endpoint llegan por .env como PGBACKREST_REPO1_S3_* (env pisa al archivo).

repo1-type         = s3
repo1-path         = /pgbackrest
repo1-s3-region    = auto
repo1-s3-uri-style = path

# --- Cifrado ---
# Se fija al crear la stanza: cambiarlo después obliga a recrear el repo entero.

repo1-cipher-type = aes-256-cbc

# --- Retención ---
# El tipo se fija acá; los días llegan por .env como PGBACKREST_REPO1_RETENTION_FULL
# (el entorno pisa al archivo). Tiene que cubrir la cola de restic: si la base
# retiene menos que el filestore, un restore viejo se queda sin adjuntos.

repo1-retention-full-type = time

# --- Bundling ---
# Agrupa los miles de archivos chicos del cluster: contra R2 manda la latencia por objeto.

repo1-bundle = y

# --- Proceso y logs ---
# process-max acotado a los cpus del contenedor (2.0) para no competir con la base.

process-max       = 2
log-level-console = info
log-level-file    = detail
log-path          = /var/log/pgbackrest
