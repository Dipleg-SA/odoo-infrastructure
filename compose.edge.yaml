services:
  traefik:
    image: traefik:v3.7.8
    # Nombre derivado del proyecto: predecible y sin el sufijo -1 del autonaming,
    # pero sin colisionar si se levanta un segundo stack con otro nombre de proyecto.
    container_name: ${COMPOSE_PROJECT_NAME}-traefik
    networks:
      - edge
      - app
    # --- Binds: el acceso lo define la IP publicada, no ufw ---
    # Docker publica por DNAT y saltea ufw; nivel 3 (LAN) para 80/443, nivel 2 (loopback) para el dashboard.

    ports:
      # cloudflared llega por la red edge (nombre de contenedor), no por estos puertos.
      - "${LOCAL_IP}:80:80"
      - "${LOCAL_IP}:443:443"
      # Dashboard sin auth propia: el aislamiento es el bind, se entra por túnel SSH.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config/traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./config/traefik/acme.json:/acme.json
      - /var/run/docker.sock:/var/run/docker.sock:ro
    secrets:
      - cloudflare_api_token
    environment:
      CF_DNS_API_TOKEN_FILE: /run/secrets/cloudflare_api_token
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"

  cloudflared:
    image: cloudflare/cloudflared:2026.7.2
    command: tunnel --metrics 0.0.0.0:2000 run
    container_name: ${COMPOSE_PROJECT_NAME}-cloudflared
    networks:
      - edge
    secrets:
      - cloudflare_tunnel_token
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tunnel_token
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
    restart: unless-stopped
    mem_limit: 64m
    cpus: "0.15"

  dnsmasq:
    build: ./docker/dnsmasq
    # Namespace local/ y no el nombre del proyecto: sin image: explícito Compose
    # autogenera <proyecto>-dnsmasq:latest, que ata la imagen al proyecto y flota.
    image: local/dnsmasq:local
    container_name: ${COMPOSE_PROJECT_NAME}-dnsmasq
    # network_mode: host — bindea directo en ${LOCAL_IP}:53 para evitar el
    # conflicto con systemd-resolved y el NAT/ufw del publish de Docker.
    network_mode: host
    # --- Forwarders y caché ---
    # Sin --server, --no-resolv deja SERVFAIL todo lo que no sea el hostname. Los
    # forwarders son política del deployment: se cambian por .env. Caché 1000 (default 150).

    command: ["--keep-in-foreground", "--no-resolv", "--bind-interfaces", "--listen-address=${LOCAL_IP}", "--address=/${PUBLIC_HOSTNAME}/${LOCAL_IP}", "--server=${DNS_FORWARDER_1:-1.1.1.1}", "--server=${DNS_FORWARDER_2:-8.8.8.8}", "--cache-size=1000"]
    # Corre como root porque el 53 es puerto privilegiado y usa el stack de red
    # del host; dnsmasq baja de privilegios por su cuenta después de bindear.
    healthcheck:
      test: ["CMD-SHELL", "nslookup ${PUBLIC_HOSTNAME} ${LOCAL_IP} | grep -q ${LOCAL_IP}"]
    restart: unless-stopped
    mem_limit: 32m
    cpus: "0.10"
