# Capa de borde. El ingreso público entra por el túnel, sin puertos abiertos en
# el router, y los certificados los emite certbot por DNS-01.
#
# El reverse proxy NO vive acá: es compose.proxy.yaml, que también lleva
# development. Lo de este archivo es lo que development no tiene.
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.7.2
    command: tunnel --metrics 0.0.0.0:2000 run
    container_name: ${COMPOSE_PROJECT_NAME}-cloudflared
    networks:
      - edge
    secrets:
      - cloudflare_tunnel_token
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tunnel_token
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
    restart: unless-stopped
    mem_limit: 64m
    cpus: "0.15"

  # --- Emisión y renovación de certificados ---
  # profiles lo deja fuera de `make up`: corre como one-off, a mano la primera vez
  # y por timer de systemd después. DNS-01 y no HTTP-01 para que la emisión no
  # dependa del ingreso — hoy el certificado se emite aunque el borde esté roto.

  certbot:
    image: certbot/dns-cloudflare:v5.1.0
    container_name: ${COMPOSE_PROJECT_NAME}-certbot
    profiles: [cert]
    networks:
      - edge
    secrets:
      - cloudflare_api_token
    # El volumen lo declara compose.proxy.yaml, que es quien lo lee: certbot
    # escribe ahí y nginx monta lo mismo en :ro. Van siempre juntos.
    volumes:
      - letsencrypt:/etc/letsencrypt
      - ./config/certbot/wrapper.sh:/usr/local/bin/wrapper.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/wrapper.sh"]
    mem_limit: 256m
    cpus: "0.50"
